<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loot Box — Arcane Vault</title>
<!-- LIEN DE L'APPLICATION PWA (OBLIGATOIRE POUR ANDROID/PC) -->
    <link rel="manifest" href="/mcc/arcane_vault/manifest.json">
    <meta name="theme-color" content="#1a1a2e">

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    
    <!-- Scripts chargés proprement pour éviter les bugs d'affichage au démarrage -->
    <script src="data.js" defer></script>
    <script src="script.js" defer></script>
</head>
<body>

<div class="stars" id="stars"></div>
<div id="flash"></div>

<div id="app">
  <header>
    <div class="logo" id="logo-click">✦ ARCANE VAULT</div>
    <div class="header-right">
      <button class="inv-btn" onclick="openSidebar()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
        INVENTAIRE
      </button>
    </div>
  </header>

  <div class="keys-panel">
    <div class="keys-icons" id="keys-icons"></div>
    <div class="keys-info">
      <div class="keys-label">CLÉS DISPONIBLES</div>
      <div class="timer-bar-wrap"><div class="timer-bar" id="timer-bar" style="width:0%"></div></div>
      <div class="timer-text" id="timer-text">—</div>
      <div class="frag-info" id="frag-info"></div>
    </div>
  </div>

  <div class="chest-area">
    <div id="chest-wrap" class="chest-wrap">
      <div class="chest-glow" id="chest-glow"></div>
      <svg id="chest-svg" viewBox="0 0 140 140" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="cg1" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1e1b4b"/><stop offset="1" stop-color="#0f0c24"/></linearGradient>
          <linearGradient id="cg2" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#312e81"/><stop offset="1" stop-color="#1e1b4b"/></linearGradient>
          <linearGradient id="cg3" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#a855f7"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
        </defs>
        <!-- Base -->
        <rect x="20" y="72" width="100" height="50" rx="8" fill="url(#cg1)" stroke="rgba(168,85,247,0.4)" stroke-width="1.5"/>
        <!-- Lid -->
        <rect x="20" y="32" width="100" height="44" rx="8" fill="url(#cg2)" stroke="rgba(168,85,247,0.4)" stroke-width="1.5"/>
        <!-- Lid arch -->
        <path d="M20 60 Q70 20 120 60" fill="rgba(168,85,247,0.08)" stroke="rgba(168,85,247,0.3)" stroke-width="1"/>
        <!-- Band -->
        <rect x="20" y="68" width="100" height="8" fill="rgba(168,85,247,0.15)" stroke="rgba(168,85,247,0.3)" stroke-width="1"/>
        <!-- Lock -->
        <rect x="58" y="60" width="24" height="18" rx="4" fill="rgba(168,85,247,0.2)" stroke="rgba(168,85,247,0.6)" stroke-width="1.5"/>
        <circle cx="70" cy="67" r="5" fill="none" stroke="url(#cg3)" stroke-width="2"/>
        <rect x="68" y="69" width="4" height="5" rx="1" fill="url(#cg3)"/>
        <!-- Studs -->
        <circle cx="34" cy="96" r="4" fill="rgba(168,85,247,0.3)" stroke="rgba(168,85,247,0.5)" stroke-width="1"/>
        <circle cx="106" cy="96" r="4" fill="rgba(168,85,247,0.3)" stroke="rgba(168,85,247,0.5)" stroke-width="1"/>
        <circle cx="34" cy="46" r="3" fill="rgba(34,211,238,0.3)" stroke="rgba(34,211,238,0.5)" stroke-width="1"/>
        <circle cx="106" cy="46" r="3" fill="rgba(34,211,238,0.3)" stroke="rgba(34,211,238,0.5)" stroke-width="1"/>
        <!-- Runes -->
        <text x="70" y="110" text-anchor="middle" fill="rgba(168,85,247,0.4)" font-size="12" font-family="serif">ᚱᚢᚾ</text>
        <text x="70" y="52" text-anchor="middle" fill="rgba(34,211,238,0.35)" font-size="10" font-family="serif">✦ ᚹ ✦</text>
      </svg>
    </div>
    <button class="open-btn" id="open-btn" onclick="openChest()">
      <span>⚔ OUVRIR LE COFFRE</span>
    </button>
  </div>

  <div id="card-area">
    <div class="card-flip" id="card-flip">
      <div class="loot-card" id="loot-card">
        <div class="card-inner" id="card-inner"></div>
      </div>
    </div>
    <button class="again-btn" id="again-btn" onclick="resetToChest()">↩ Ouvrir un autre coffre</button>
  </div>
</div>

<!-- Sidebar -->
<div id="overlay" onclick="closeSidebar()"></div>
<div id="sidebar">
  <div class="sidebar-header">
    <span class="sidebar-title">✦ Inventaire</span>
    <button class="close-btn" onclick="closeSidebar()">✕</button>
  </div>
  <div class="completion-bar">
    <div class="completion-label">
      <span id="completion-text">Collection : 0 / 0</span>
      <span id="completion-pct">0%</span>
    </div>
    <div class="completion-track"><div class="completion-fill" id="completion-fill" style="width:0%"></div></div>
  </div>
  <div class="search-wrap">
    <input class="search-input" id="search-input" placeholder="Rechercher un objet…" oninput="renderInventory()">
  </div>
  <div class="sidebar-tabs" id="sidebar-tabs"></div>
  <div class="inv-list" id="inv-list"></div>
  <div class="inv-stats" id="inv-stats"></div>
</div>

<!-- Modal MJ -->
<div id="modal">
  <div class="modal-box">
    <div class="modal-title">⚿ CODE MAÎTRE</div>
    <input class="modal-input" id="mj-input" type="password" maxlength="4" placeholder="····" oninput="checkMJCode()">
    <div class="modal-btns">
      <button class="modal-btn" onclick="closeModal()">Annuler</button>
    </div>
  </div>
</div>

<!-- MJ Panel -->
<div id="mj-panel">
  <div class="mj-title">⚙ MODE MAÎTRE DU JEU</div>
  <button class="mj-btn" onclick="mjResetKeys()">⚿ Recharger les 3 Clés</button>
  <div class="mj-toggle">
    <span>Forcer Artefact</span>
    <label class="toggle-switch">
      <input type="checkbox" id="force-legendary" onchange="updateForceLegendary()">
      <span class="toggle-slider"></span>
    </label>
  </div>
</div>

<div id="secret-zone" id="secret-zone"></div>
<div id="toast"></div>


<!-- FOOTER JURIDIQUE DISCRET -->

<footer class="legal-footer">
    <p>© 2026 <a href="https://bolt.host" target="_blank">Moulecake Corporation Company</a>. Tous droits réservés. Une création Arcane Vault.</p>
    <div class="legal-links">
        <span onclick="openLegalModal('mentions')">Mentions Légales</span> | 
        <span onclick="openLegalModal('confidentialite')">Confidentialité & Cookies</span> | 
        <span onclick="openLegalModal('accessibilite')">Accessibilité</span>
    </div>
</footer>

<!-- MODALE JURIDIQUE UNIQUE -->
<div id="legal-modal" class="legal-modal" style="display: none;">
    <div class="legal-modal-content">
        <span class="legal-modal-close" onclick="closeLegalModal()">✕</span>
        <h3 id="legal-modal-title" style="margin-top: 0; color: var(--rarity-A, #ff4a4a);">Titre</h3>
        <div id="legal-modal-body" style="line-height: 1.6; font-size: 0.9rem; max-height: 60vh; overflow-y: auto;">
            Texte...
        </div>
    </div>
</div>


</body>
</html>
